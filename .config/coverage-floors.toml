# Coverage floors for the Rust workspace, enforced by the coverage job of
# .github/workflows/windows-ci.yml (common/scripts/ci/render_coverage.py).
#
# Values are percentages (0-100). A run fails when the measured coverage is
# below a floor, or when total line coverage drops more than 2.0 points below
# the latest master run (the delta gate; it needs no entry here).
#
# Raising a floor:
#   1. Open the latest green windows-ci run on master and read the
#      "Coverage (ubuntu-latest)" summary: it lists the total and every crate.
#   2. Set the floor a little (1-2 points) below the measured value, so normal
#      refactoring noise does not fail CI, and commit it with the code that
#      earned it ("ci(windows): raise tokenmon-core line floor to 80").
#   3. Never lower a floor to make a change pass; add tests. Only thin
#      cfg(windows) glue may be excluded, in .config/coverage-excludes.txt
#      (see the rules there).
#
# Floors only ever go up. Start at 0 while the workspace is being built.

# Set 2026-11-27 from the lower of the Ubuntu (windows-ci, --branch) and
# Windows (windows-coverage-nightly) runners on 16d99db4, about one point below.
# Branch floors gate only runs that measure branches (Ubuntu).

