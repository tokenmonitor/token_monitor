codecov:
  require_ci_to_pass: false

coverage:
  status:
    # Project-wide coverage is informational; the patch status gates PRs.
    project:
      default:
        informational: true
    patch:
      default:
        target: 50%
        only_pulls: true

# CI uploads LCOV for the app target only (macos/scripts/xccov_to_lcov.py), so only
# app sources count. UI-only files without tests are excluded: SwiftUI views
# and the custom-drawn rows, bars, and charts listed by name. Files with unit
# tests (for example SegmentedUsageBar.swift) stay in.
ignore:
  - "macos/TokenMonTests/**"
  - "macos/Tests/**"
  - "macos/TokenMon/App/AppDelegate.swift"
  - "macos/TokenMon/**/*View.swift"
  - "macos/TokenMon/UI/MenuBar/CategoryRow.swift"
  - "macos/TokenMon/Providers/OpenCode/OpenCodeLimitBar.swift"
  - "macos/TokenMon/Features/Overview/OverviewHourlyUsageChart.swift"
