# One Cargo workspace for every desktop port: shared code in common/crates,
# Windows-only code in windows/crates (and Linux-only code in linux/crates once
# it exists). One Cargo.lock, one [workspace.dependencies] table, one target/.
[workspace]
resolver = "3"
# The sign-in probe has its own workspace: wry/tao pull gtk 0.19 on Linux, which
# cannot share a lockfile with tray-icon 0.26 (gtk 0.18) (finding of the M0 report).
exclude = ["common/fuzz", "macos-rust/crates/tokenmon-signin-probe"]
members = [
    "common/crates/tokenmon-core",
    "common/crates/tokenmon-provider-grok",
    "common/crates/tokenmon-provider-cursor",
    "common/crates/tokenmon-provider-grokbot",
    "common/crates/tokenmon-provider-claude",
    "common/crates/tokenmon-provider-chatgpt",
    "common/crates/tokenmon-provider-opencode",
    "common/crates/tokenmon-provider-openrouter",
    "common/crates/tokenmon-platform",
    "windows/crates/tokenmon-platform-windows",
    "common/crates/tokenmon-ui",
    "common/crates/tokenmon-app",
    "windows/crates/tokenmon-windows",
    "macos-rust/crates/tokenmon-macos",
]

[workspace.package]
version = "1.13.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/tokenmonitor/token_monitor"
publish = false

# Shared dependency versions. Member crates reference these with
# `dep = { workspace = true }` and never pin a version of their own.
[workspace.dependencies]
# Internal crates
tokenmon-core = { path = "common/crates/tokenmon-core" }
tokenmon-provider-grok = { path = "common/crates/tokenmon-provider-grok" }
tokenmon-provider-cursor = { path = "common/crates/tokenmon-provider-cursor" }
tokenmon-provider-grokbot = { path = "common/crates/tokenmon-provider-grokbot" }
tokenmon-provider-claude = { path = "common/crates/tokenmon-provider-claude" }
tokenmon-provider-chatgpt = { path = "common/crates/tokenmon-provider-chatgpt" }
tokenmon-provider-opencode = { path = "common/crates/tokenmon-provider-opencode" }
tokenmon-provider-openrouter = { path = "common/crates/tokenmon-provider-openrouter" }
tokenmon-platform = { path = "common/crates/tokenmon-platform" }
tokenmon-platform-windows = { path = "windows/crates/tokenmon-platform-windows" }
tokenmon-ui = { path = "common/crates/tokenmon-ui" }
tokenmon-app = { path = "common/crates/tokenmon-app" }

# Runtime (feature sets are minimal; crates add what they need)
tokio = { version = "1.54", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.41", features = ["bundled"] }
slint = { version = "1.18", default-features = false }
slint-build = "1.18"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
rfd = { version = "0.17", default-features = false }

# Dev
wiremock = "0.6"
tempfile = "3.27"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise for this code base.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
doc_markdown = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"
unwrap_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
