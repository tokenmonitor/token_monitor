name: macOS installers

# Builds the macOS release files from the composable actions in
# .github/actions/ and keeps them as a workflow artifact:
#
#   TokenMon-<version>.pkg        installer package (Developer ID Installer signed when available)
#   TokenMon-<version>.zip        the app, used by the in-app updater
#   TokenMon-<version>-dSYM.zip   debug symbols
#
# Used three ways:
#   * release.yml calls it (workflow_call) after the CI gates, then publishes
#     the artifact to the GitHub Release;
#   * a dry run on every push to master that touches the installer
#     pipeline, and on manual dispatch (Actions tab);
#   * the steps are the same ones to reuse from any other workflow:
#       macos-import-signing -> macos-build-app -> macos-notarize (app)
#       -> macos-pkg -> macos-notarize (pkg), then `make _zip _dsym`.
#
# Signing and notarization are off until the Apple secrets exist: each action
# does nothing when its inputs are empty, so an unsigned build works today.
#   MACOS_APP_CERTIFICATE_BASE64        base64 of the "Developer ID Application" .p12
#   MACOS_INSTALLER_CERTIFICATE_BASE64  base64 of the "Developer ID Installer" .p12
#   MACOS_CERTIFICATE_PASSWORD          password of both .p12 files
#   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD
#                                       notary service credentials (app-specific password)

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the artifact that holds the files
        type: string
        default: tokenmon-macos
    outputs:
      version:
        description: MARKETING_VERSION of the build
        value: ${{ jobs.build.outputs.version }}
    secrets:
      MACOS_APP_CERTIFICATE_BASE64:
        required: false
      MACOS_INSTALLER_CERTIFICATE_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_NOTARY_APPLE_ID:
        required: false
      MACOS_NOTARY_TEAM_ID:
        required: false
      MACOS_NOTARY_PASSWORD:
        required: false
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/actions/macos-*/**"
      - ".github/workflows/macos-installers.yml"
      - "Scripts/notarize.sh"

permissions:
  contents: read

concurrency:
  group: macos-installers-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build pkg, zip and dSYM
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.app.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `make` numbers the build by commit count.
          fetch-depth: 0
          persist-credentials: false

      - name: Import signing identities (skipped without certificates)
        id: signing
        uses: ./.github/actions/macos-import-signing
        with:
          application-certificate-base64: ${{ secrets.MACOS_APP_CERTIFICATE_BASE64 }}
          installer-certificate-base64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      # The committed project is used as-is; the CI gates fail on drift.
      - name: Build the Release app
        id: app
        uses: ./.github/actions/macos-build-app

      - name: Notarize the app (skipped without credentials)
        uses: ./.github/actions/macos-notarize
        with:
          path: ${{ steps.app.outputs.app-path }}
          apple-id: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          team-id: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          app-specific-password: ${{ secrets.MACOS_NOTARY_PASSWORD }}

      # The app is stapled first so the pkg and the zip carry the ticket.
      - name: Build the pkg
        id: pkg
        uses: ./.github/actions/macos-pkg

      - name: Notarize the pkg (skipped without credentials)
        uses: ./.github/actions/macos-notarize
        with:
          path: ${{ steps.pkg.outputs.pkg-path }}
          apple-id: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          team-id: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          app-specific-password: ${{ secrets.MACOS_NOTARY_PASSWORD }}

      - name: Build the app zip and the dSYM zip
        run: make _zip _dsym

      - name: Collect and checksum the files
        env:
          VERSION: ${{ steps.app.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signing }}
        run: |
          set -euo pipefail
          for f in "dist/TokenMon-${VERSION}.pkg" "dist/TokenMon-${VERSION}.zip" "dist/TokenMon-${VERSION}-dSYM.zip"; do
            test -f "$f"
          done
          mkdir -p out
          cp "dist/TokenMon-${VERSION}.pkg" "dist/TokenMon-${VERSION}.zip" "dist/TokenMon-${VERSION}-dSYM.zip" out/
          (cd out && shasum -a 256 -- * | tee SHA256SUMS.txt)
          {
            echo "### macOS installers: $VERSION"
            echo
            if [ "$SIGNED" = true ]; then
              echo "Signed with the imported Developer ID certificates."
            else
              echo "Unsigned (ad hoc): Gatekeeper warns on a first download. No Developer ID certificate is configured."
            fi
            echo
            echo '```text'
            cat out/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name || 'tokenmon-macos' }}
          path: out/
          if-no-files-found: error
          retention-days: 14
