name: macOS notarize
description: >-
  Submits a Developer ID signed .app or .pkg to the Apple notary service
  and staples the ticket (macos/Scripts/notarize.sh). Does nothing when the Apple
  credentials are empty, so it can stay in the pipeline before an account exists.

inputs:
  path:
    description: The .app or .pkg to notarize, relative to the workspace.
    required: true
  apple-id:
    description: Apple ID e-mail. Empty skips notarization.
    required: false
    default: ""
  team-id:
    description: Apple Developer Team ID.
    required: false
    default: ""
  app-specific-password:
    description: App-specific password of the Apple ID.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Notarize and staple
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        APPLE_ID: ${{ inputs.apple-id }}
        TEAM_ID: ${{ inputs.team-id }}
        APP_PASSWORD: ${{ inputs.app-specific-password }}
      run: |
        set -euo pipefail
        if [ -z "$APPLE_ID" ] || [ -z "$TEAM_ID" ] || [ -z "$APP_PASSWORD" ]; then
          echo "No Apple notary credentials given: $TARGET is not notarized."
          exit 0
        fi
        profile=tokenmon-ci-notary
        xcrun notarytool store-credentials "$profile" \
          --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" >/dev/null
        ./macos/Scripts/notarize.sh "$TARGET" "$profile"
