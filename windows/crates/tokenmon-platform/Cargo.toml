[package]
name = "tokenmon-platform"
description = "TokenMon OS services behind traits, with in-memory fakes and the portable logic around them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokenmon-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Wipes decrypted secrets and plaintext vault JSON when dropped.
zeroize = "1.8"
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
zip = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# Real provider configs keep the capture tests honest about their cookie lists.
tokenmon-provider-grok = { workspace = true }
tokenmon-provider-opencode = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
wiremock = { workspace = true }
